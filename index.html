<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tibia Market</title>
<style>
  :root { --bg: #15110b; --surface: #1f1912; --text: #efe6d3; --muted: #b8ab90; --gold: #ffd700; --border: #3a2f1f; }
  @media (prefers-color-scheme: light) {
    :root { --bg: #fbf8f1; --surface: #ffffff; --text: #2b2013; --muted: #6b5e45; --gold: #8b6f00; --border: #e6dcc6; }
  }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.65 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { color: var(--gold); margin: 0 0 16px; }
  a.card { display: block; background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
           padding: 16px 20px; margin: 12px 0; color: var(--text); text-decoration: none; }
  a.card strong { color: var(--gold); }
  footer { color: var(--muted); font-size: .9rem; margin-top: 48px; }
</style>
</head>
<body>
<main>
  <h1>Tibia Market</h1>
  <a class="card" href="privacidade/"><strong>Política de Privacidade</strong><br>Quais dados o app coleta e por quê.</a>
  <a class="card" href="excluir-conta/"><strong>Excluir conta</strong><br>Como apagar sua conta e seus dados.</a>
  <footer>Tibia é marca registrada da CipSoft GmbH. O Tibia Market não é afiliado, patrocinado nem aprovado pela CipSoft.</footer>
</main>
</body>
</html>
